<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il Cartografo Errante</title>
<meta name="description" content="Generatori procedurali di mappe fantasy: regni, città, villaggi, caverne, dungeon e dimore.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <a class="brand" href="#" data-route="home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 4 19 16 16 28 13 16Z" fill="currentColor"/><path d="M4 16 16 13 28 16 16 19Z" fill="currentColor" opacity=".45"/></svg>
      <span data-i18n="brand">Il Cartografo Errante</span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Generatori"></nav>
    <div class="lang" role="group" data-i18n-label="nav.lang">
      <button type="button" id="lang-it" data-lang="it">IT</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </div>
  </header>

  <main class="hub" id="view-hub">
    <section class="hub-intro">
      <h1 data-i18n="brand">Il Cartografo Errante</h1>
      <p class="lede" data-i18n="tagline"></p>
    </section>
    <h2 class="hub-pick" data-i18n="hub.pick"></h2>
    <div class="cards" id="cards"></div>
    <footer class="hub-footer">
      <p data-i18n="hub.footer"></p>
      <p><a href="https://watabou.github.io" target="_blank" rel="noopener" data-i18n="hub.credit"></a></p>
    </footer>
  </main>

  <main class="workbench" id="view-gen" hidden>
    <aside class="panel" id="panel">
      <div class="panel-head">
        <h1 id="gen-title"></h1>
        <p id="gen-desc" class="muted"></p>
      </div>

      <div class="seed-row">
        <button type="button" class="btn primary" id="btn-new" data-i18n-title="ui.newHint">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 6.5A6.5 6.5 0 1 0 16.5 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16.8 2.8v4.4h-4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="ui.new"></span>
        </button>
        <form class="seed-form" id="seed-form">
          <label for="seed-input" data-i18n="ui.seed"></label>
          <input id="seed-input" inputmode="numeric" autocomplete="off" spellcheck="false">
          <button type="submit" class="btn icon" data-i18n-title="ui.seedApply" data-i18n-label="ui.seedApply">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
      </div>

      <section class="panel-section">
        <h2 data-i18n="ui.options"></h2>
        <form id="options" class="options"></form>
      </section>

      <section class="panel-section">
        <h2 data-i18n="ui.style"></h2>
        <div class="swatches" id="palettes" role="radiogroup" data-i18n-label="ui.style"></div>
      </section>

      <section class="panel-section">
        <h2 data-i18n="ui.export"></h2>
        <div class="export-row">
          <button type="button" class="btn" id="btn-png" data-i18n="ui.png"></button>
          <button type="button" class="btn" id="btn-svg" data-i18n="ui.svg"></button>
          <button type="button" class="btn ghost" id="btn-link" data-i18n="ui.copyLink"></button>
        </div>
      </section>

      <section class="panel-section notes" id="notes-section" hidden>
        <h2 data-i18n="ui.notes"></h2>
        <div id="notes"></div>
      </section>
    </aside>

    <div class="stage" id="stage">
      <div class="viewport" id="viewport" role="img" data-i18n-label="ui.mapLabel" tabindex="0"></div>
      <div class="zoom" role="group">
        <button type="button" class="btn icon" id="zoom-in" data-i18n-title="ui.zoomIn" data-i18n-label="ui.zoomIn"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button type="button" class="btn icon" id="zoom-out" data-i18n-title="ui.zoomOut" data-i18n-label="ui.zoomOut"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button type="button" class="btn icon" id="zoom-fit" data-i18n-title="ui.fit" data-i18n-label="ui.fit"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <p class="stage-hint" data-i18n="ui.dragHint"></p>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="overlay" id="save-overlay" hidden>
  <div class="overlay-box" role="dialog" aria-modal="true" aria-labelledby="save-overlay-text">
    <p id="save-overlay-text" data-i18n="ui.saveFallback"></p>
    <div class="overlay-img"><img id="save-overlay-img" alt=""></div>
    <button type="button" class="btn primary" id="save-overlay-close" data-i18n="ui.close"></button>
  </div>
</div>

<script src="js/core/rng.js"></script>
<script src="js/core/noise.js"></script>
<script src="js/core/geom.js"></script>
<script src="js/core/voronoi.js"></script>
<script src="js/core/contour.js"></script>
<script src="js/core/svg.js"></script>
<script src="js/core/names.js"></script>
<script src="js/core/palettes.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/fonts.js"></script>
<script src="js/core/draw.js"></script>
<script src="js/core/app.js"></script>
<script src="js/gen/realm.js"></script>
<script src="js/gen/city.js"></script>
<script src="js/gen/village.js"></script>
<script src="js/gen/cave.js"></script>
<script src="js/gen/dungeon.js"></script>
<script src="js/gen/dwelling.js"></script>
<script src="js/main.js"></script>
</body>
</html>
